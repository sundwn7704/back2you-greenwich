<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f2">
    <meta name="description" content="Report a suspicious link, message, or online incident to the Suri community.">
    <title>Submit a Report | Suri</title>

    <!-- Shared Bootstrap styles keep this page consistent with the homepage. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/menu.css">
    <link rel="stylesheet" href="styles/report.css">
    <link rel="stylesheet" href="styles/footer.css">

</head>
<body>
    <header class="navbar navbar-expand-md sticky-top bg-light px-3 px-lg-5 bg-black">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="#home" aria-label="Suri home">
                <span class="brand-name fs-4 fw-bold">back2you<span class="brand-period">.</span></span>
            </a>

            <button class="navbar-toggler" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>

            <nav class="collapse navbar-collapse justify-content-md-end" id="site-navigation" aria-label="Main navigation">
                <div class="navbar-nav align-items-md-center gap-md-5">
                    <a class="nav-link active" href="index.html" aria-current="page">Home</a>
                    <a class="nav-link" href="report.html">Report</a>
                    <a class="nav-link" href="#how-it-works">Items</a>
                    <a class="nav-link" href="#volunteer">Contact</a>
                </div>
            </nav>
        </div>
    </header>

    <main>



        <section class="d-flex justify-content-end">


            <div class="col-4">
                <label for="report-image" class="upload-image">
                    <img src="images/submit here.png" alt="Click to upload an image">
                </label>

                <input type="file"
                       id="report-image"
                       name="screenshot"
                       accept="image/png, image/jpeg, image/webp"
                       hidden>
            </div>




            <!--
              <div class="col-12">
                  <label class="form-label" for="report-screenshot">Screenshot attachment</label>
                  <input class="form-control" id="report-screenshot" name="screenshot" type="file" accept="image/png,image/jpeg,image/webp">
              </div>
            -->


            <form class="report-form bg-white" id="report-form" novalidate>

                <div class="row g-4">
                    <div class="col-12">
                        <label class="form-label" for="report-category">Item Name<span aria-hidden="true">*</span></label>
                        <input class="form-control" id="email-address" name="email" type="email" autocomplete="email" required>

                        <div class="invalid-feedback">Choose the category that best fits, or select Other or unsure.</div>
                    </div>
            </form>



            <div class="row g-4">
                <div class="col-12">
                    <label class="form-label" for="report-category">Category <span aria-hidden="true">*</span></label>
                    <select class="form-select" id="report-category" name="category" required>
                        <option value="" selected disabled>Select a category</option>
                        <option value="personal-belongings">Personal Belongings</option>
                        <option value="electronics-gadgets">Electronics and Gadgets</option>
                        <option value="clothing-accessories">Clothing and Accessories</option>
                        <option value="school-office-supplies">School and Office Supplies</option>
                        <option value="food-containers">Food and Containers</option>
                        <option value="others">Others</option>
                    </select>
                    <div class="invalid-feedback">Choose the category that best fits, or select Other or unsure.</div>
                </div>




                <!-- Change to Address later-->



                <div class="col-12">
                    <label class="form-label" for="email-address">Address<span aria-hidden="true">*</span></label>
                    <input class="form-control" id="email-address" name="email" type="email" autocomplete="email" required>
                    <div class="invalid-feedback">Enter a valid email address.</div>
                </div>





                <div class="col-12">
                    <label class="form-label" for="email-address">Email address <span aria-hidden="true">*</span></label>
                    <input class="form-control" id="email-address" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    <div class="invalid-feedback">Enter a valid email address.</div>
                </div>








            </div>



        </section>



    </main>


</body>
</html>
