<body id="bodybg">
  <!-- STICKY HEADER -->
  <header class="navbar navbar-expand-md sticky-top bg-light px-3 px-lg-5 bg-black">
    <!--LOGO-->
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="#home" aria-label="Suri home">
        <span class="brand-name fs-4 fw-bold">back2you<span class="brand-period">.</span></span>
      </a>
      <!-- Hamburger button -->
      <button class="navbar-toggler" type="button" aria-label="Open navigation menu" aria-expanded="false"
        aria-controls="site-navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <!-- Navigation menu -->
      <nav class="collapse navbar-collapse justify-content-md-end" id="site-navigation" aria-label="Main navigation">
        <div class="navbar-nav align-items-md-center gap-md-5">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link active" href="report.html" aria-current="page">Report</a>
          <a class="nav-link" href="index.html#how-it-works">Items</a>
          <a class="nav-link" href="contact.html">Contact</a>
        </div>
      </nav>
    </div>
  </header>


  <main>


    <section class="container mt-4 mb-4">

      <!-- FORM -->
      <form>
        <div class="row">


          <!-- IMAGE UPLOAD -->
          <div class="col-12 col-lg-6 container-fluid">
            <label>
              <img src="submit_photo.png" alt="Click to upload Image" id="imagesubmit">
            </label>


            <input type="file" id="filesubmit" name="filesubmit" accept="image/png, image/jpeg, image/webp">

          </div>


          <div id="answerscss" class="col-lg-6 col-12 d-flex flex-column justify-content-between mt-3 container-fluid">

            <div>
              <H5 class="fw-semibold"> Item name</H5>
              <label>
                <input type="text" id="itemname" name="itemname" required>
              </label>
            </div>

            <!-- Item category dropdown-->

            <div>
              <h5 class="fw-semibold"> Category</h5>
              <label>
                <select id="categories" name="categories" class="fw-semibold" required>
                  <option value="" selected disabled>Select a category</option>
                  <option value="personal-belongings">Personal Belongings</option>
                  <option value="electronics-gadgets">Electronics and Gadgets</option>
                  <option value="clothing-accessories">Clothing and Accessories</option>
                  <option value="school-office-supplies">School and Office Supplies</option>
                  <option value="food-containers">Food and Containers</option>
                  <option value="others">Others</option>

                </select>
              </label>
            </div>

            <div>
              <h5 class="fw-semibold">Address</h5>
              <label>
                <textarea id="address" name="address" required></textarea>
              </label>
            </div>

            <div>
              <H5 class="fw-semibold"> Email </H5>
              <label>
                <input type="email" id="emailadd" name="emailadd" required>
              </label>
            </div>

            <div>
              <br>
              <label>
                <button type="submit" id="submitbutton" class="fw-semibold"> Submit</button>
              </label>
            </div>





          </div>
      </form>
    </section>
  </main>

  <footer class="site-footer py-4">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
      <p class="footer-copyright mb-0">&copy; 2026 back2you</p>
      <p class="footer-notice mb-0">This is intended for Web Development (WEBDEVT) demo purposes only.</p>
    </div>
  </footer>


</body>
